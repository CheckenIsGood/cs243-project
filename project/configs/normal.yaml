# Normal-context control for the pilot (full plan item 2). Same 10 held-out questions, delays, deadlines and
# measured costs as configs/pilot.yaml; the ONLY change is that context is not binding:
#   result_token_cap 1200 (> every observed BM25 top-4 result; max seen 1156) and final_context_cap 7000
#   (4 raw results + base prompt + answer always fit; server max-model-len 8192).
# Theory (Prop 2 / B2): when everything fits, folding raw is within (n-1)*delta of optimal, the MDP and RSS
# summarize nothing, and summaries only add decode time. This run checks that on the real system and measures
# answer quality from raw evidence vs the summaries used in the stress setting (pilot: final_context_cap 1600).
name: normal
backend: vllm
base_url: http://127.0.0.1:8000
model: Qwen/Qwen3-8B
split: heldout
n_questions: 10
policies: [incremental, fold, rss]
deadlines_s: [13.0, 16.0, 19.0]
latency_seeds: [1]
out_dir: results/real
top_k: 4
result_token_cap: 1200
final_context_cap: 7000
final_max_tokens: 64
consume_out_per_result: 128
costs: {overhead_s: 0.0, prefill_s_per_tok: 0.0001735, decode_s_per_tok: 0.02934,
        raw_tokens: 593, summary_tokens: 85, consume_base_prompt: 132, final_base_prompt: 82,
        consume_out_base: 0, consume_out_per_result: 102, final_out: 11}
