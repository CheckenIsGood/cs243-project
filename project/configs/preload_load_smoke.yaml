# KV-preload deadline experiment (full plan item 3) at a larger evidence load.
# Workload: 8 parallel searches per question over a pooled corpus (the question's 10 paragraphs + 90 paragraphs
# from non-manifest questions, deterministic per question), top_k 10, result cap 1500 tokens -> ~8-10k tokens of
# evidence. Context is NOT binding (final cap 15000; server max-model-len 16384), so no policy needs summaries.
# Server: PREFIX_CACHE=1 MAXLEN=16384 scripts/serve_model.sh; cache reset before every run.
# Deadline design: fold, fold_preload and incremental never read the clock (static policies), so their decisions
# do not depend on D. One run with a non-binding deadline gives each run's completion time T, and the miss
# rate at ANY deadline D is exactly P(T > D) (same runs, same delays). Hence deadlines_s: [60].
name: preload_load_smoke
backend: vllm
base_url: http://127.0.0.1:8000
model: Qwen/Qwen3-8B
split: calibration
n_questions: 2
policies: [incremental, fold, fold_preload]
deadlines_s: [60.0]
latency_seeds: [1]
out_dir: results/real
n_calls: 8
top_k: 10
result_token_cap: 1500
distractor_passages: 90
plan_max_tokens: 256
final_context_cap: 15000
final_max_tokens: 64
consume_out_per_result: 128
evidence_log: true
prefix_caching: true
costs: {overhead_s: 0.0, prefill_s_per_tok: 0.0001735, decode_s_per_tok: 0.02934,
        raw_tokens: 1300, summary_tokens: 85, consume_base_prompt: 132, final_base_prompt: 82,
        consume_out_base: 0, consume_out_per_result: 102, final_out: 11}
