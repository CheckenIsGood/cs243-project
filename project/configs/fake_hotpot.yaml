# CPU-only correctness run on real HotpotQA retrieval with the FAKE model (answers are mechanical; F1 meaningless).
name: fake-hotpot
backend: fake
split: calibration
n_questions: 5
policies: [incremental, batch2, fold, rss, optimal]
deadlines_s: [14, 18, 24]
latency_seeds: [1]
out_dir: results/fake
top_k: 4
result_token_cap: 1200
final_context_cap: 2048   # evidence budget that forces summaries (calibrate at Gate 1)
costs: {overhead_s: 0.08, prefill_s_per_tok: 0.000333, decode_s_per_tok: 0.0333,
        raw_tokens: 650, summary_tokens: 60, consume_base_prompt: 150, final_base_prompt: 150}
