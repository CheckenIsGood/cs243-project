# Gate 1 smoke: real vLLM, 3 calibration questions, generous deadline (checks the plumbing, not policies).
name: smoke
backend: vllm
base_url: http://127.0.0.1:8000
model: Qwen/Qwen3-8B
split: calibration
n_questions: 3
policies: [fold, rss]
deadlines_s: [60]
latency_seeds: [1]
out_dir: results/real
top_k: 4
result_token_cap: 1200
final_context_cap: 2048
costs: {overhead_s: 0.08, prefill_s_per_tok: 0.000333, decode_s_per_tok: 0.0333,
        raw_tokens: 650, summary_tokens: 60, consume_base_prompt: 150, final_base_prompt: 150}
