# Live verification of KV preloading (full plan item 3): prefix caching ON (PREFIX_CACHE=1 serve_model.sh),
# evidence-log prompt layout for BOTH policies, cache reset before every run. Generous deadline: this checks
# cached_tokens and final-request latency, not deadline behaviour. Calibration questions only.
name: preload_smoke
backend: vllm
base_url: http://127.0.0.1:8000
model: Qwen/Qwen3-8B
split: calibration
n_questions: 4
policies: [fold, fold_preload]
deadlines_s: [60.0]
latency_seeds: [1]
out_dir: results/real
top_k: 4
result_token_cap: 576
final_context_cap: 14000
final_max_tokens: 64
evidence_log: true
prefix_caching: true
costs: {overhead_s: 0.0, prefill_s_per_tok: 0.0001735, decode_s_per_tok: 0.02934,
        raw_tokens: 569, summary_tokens: 85, consume_base_prompt: 132, final_base_prompt: 82,
        consume_out_base: 0, consume_out_per_result: 102, final_out: 11}
