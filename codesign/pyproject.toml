[project]
name = "codesign"
version = "0.1.0"
description = "Provable scheduling for agent serving with tool waits and bounded KV, and its vLLM co-design"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6", "matplotlib>=3.8", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8", "z3-solver>=4.12", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesign", "src/deadline_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # use this folder's copy of deadline_agent, not ../project's editable install
